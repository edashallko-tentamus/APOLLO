# LIMS3 backend (Java). Every value can be overridden by an environment variable of the same meaning.
spring.application.name=lims-backend
spring.main.banner-mode=off

# Listens on the loopback only, like the Node backend; the front end (frontend/server.js) forwards to it.
server.address=127.0.0.1
server.port=${LIMS_JAVA_PORT:3002}
server.error.whitelabel.enabled=false

# The database: DATABASE_URL (postgres://user:pass@host:port/db?sslmode=...), the same variable the Node backend reads.
# DataSourceConfig turns it into a JDBC URL.
lims.database-url=${DATABASE_URL:}
lims.db.pool-size=${LIMS_DB_POOL:10}
lims.db.statement-timeout=${LIMS_STATEMENT_TIMEOUT:30s}

# Migrations and demo data, applied at start: the folder holding migrations/ and seed*.sql (relative to the working
# directory; npm run start:java runs in backend-java). LIMS_MIGRATE_URL: the owner account that runs them on a GxP server.
lims.db-root=${LIMS_DB_ROOT:../backend/db}
lims.migrate-url=${LIMS_MIGRATE_URL:}

# Sign-in: sessions end after this many idle minutes; behind HTTPS (1) the cookie is Secure and HSTS is sent.
lims.idle-minutes=${LIMS_IDLE_MINUTES:30}
lims.https=${LIMS_HTTPS:0}
# Per computer: wrong passwords in 15 minutes, and requests a minute to the public pages
lims.fail-limit=${LIMS_FAIL_LIMIT:20}
lims.public-limit=${LIMS_PUBLIC_LIMIT:120}

# Headless Chromium (PDFs, screenshots): a Chromium executable to use instead of the one Playwright downloads
lims.playwright-path=${PLAYWRIGHT_PATH:}

# Start the web layer with the server, not on the first request (a cold first request took seconds)
spring.mvc.servlet.load-on-startup=1

# The address people open, printed in PDFs and emails (verification links, the client's quote and OOS pages):
# LIMS_PUBLIC_URL, else http://localhost:PORT (PORT is the front end's port, as for the Node backend)
lims.public-url=${LIMS_PUBLIC_URL:}
lims.public-port=${PORT:3000}

# The iMonnit API key for a real sensor connection (the pretend Sandbox service needs none); never stored in the database
lims.imonnit-key=${LIMS_IMONNIT_KEY:}
