# LIMS3 backend (Java). Every value can be overridden by an environment variable of the same meaning.
spring.application.name=lims-backend
spring.main.banner-mode=off

# Listens on the loopback only, like the Node backend; the front end (frontend/server.js) forwards to it.
server.address=127.0.0.1
server.port=${LIMS_JAVA_PORT:3002}
server.error.whitelabel.enabled=false

# The database: DATABASE_URL (postgres://user:pass@host:port/db?sslmode=...), the same variable the Node backend reads.
# DataSourceConfig turns it into a JDBC URL.
lims.database-url=${DATABASE_URL:}
lims.db.pool-size=${LIMS_DB_POOL:10}
lims.db.statement-timeout=${LIMS_STATEMENT_TIMEOUT:30s}

# Sign-in stays in the Node backend until it moves to Java: sessions are resolved through it.
lims.node-url=${LIMS_API_URL:http://127.0.0.1:3001}
lims.https=${LIMS_HTTPS:0}
