<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIMS3 Sandbox</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">L3</span><div><b>LIMS3</b><small>Sandbox · demo data · not for GxP use</small></div></div>
  <div class="gsearch" id="gsearch" hidden><input id="gsInput" type="search" autocomplete="off" spellcheck="false" placeholder="Search any ID, name or number (or scan)" aria-label="Search the LIMS"><div id="gsPop" class="gspop" hidden></div></div>
  <div class="who">
    <div class="lab"><button id="labBtn" class="labicon" aria-haspopup="true">…</button><div id="labMenu" class="labmenu" role="menu"></div></div>
    <span id="whoName" class="whoname"></span><button id="pwBtn" class="btn ghost small" hidden>Change password</button><button id="outBtn" class="btn ghost small" hidden>Sign out</button>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toasts"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
