<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your quotation</title>
<style>
  :root { --ink: #1d2329; --muted: #5c6773; --line: #d9e0e4; --green: #1f3a2c; --ok: #1e7a4a; --bad: #b42318; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #f4f6f7; }
  main { max-width: 820px; margin: 32px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0 0 4px; color: var(--green); } p { margin: 6px 0; } .muted { color: var(--muted); font-size: 13.5px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; } th, td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; } .n { text-align: right; white-space: nowrap; }
  .tot { text-align: right; font-size: 17px; font-weight: 700; color: var(--green); margin-top: 10px; }
  .wrap { overflow-x: auto; }
  label.f { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
  input[type=text], textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
  .btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button { font: inherit; padding: 9px 18px; border-radius: 6px; border: 1px solid var(--green); background: var(--green); color: #fff; cursor: pointer; }
  button.no { background: #fff; color: var(--bad); border-color: var(--bad); }
  .ok { color: var(--ok); font-weight: 700; } .bad { color: var(--bad); font-weight: 700; }
  a { color: var(--green); }
</style></head>
<body><main>
  <div class="card" id="q"><h1>Your quotation</h1><p class="muted">Loading…</p></div>
  <div class="card" id="act" hidden></div>
</main>
<script src="/js/public/quote-response.js"></script>
</body></html>
