<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Out of specification result: your answer</title>
<style>
  :root { --ink: #1d2329; --muted: #5c6773; --line: #d9e0e4; --green: #1f3a2c; --ok: #1e7a4a; --bad: #b42318; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #f4f6f7; }
  main { max-width: 660px; margin: 40px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 22px 24px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0 0 4px; color: var(--green); } p { margin: 6px 0; } .muted { color: var(--muted); font-size: 13.5px; }
  dl { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; margin: 10px 0 0; } dt { color: var(--muted); } dd { margin: 0; }
  .opt { display: block; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; cursor: pointer; }
  .opt:has(input:checked) { border-color: var(--green); background: #f1f7f3; }
  .opt b { display: block; } .opt span { color: var(--muted); font-size: 13.5px; }
  label.f { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
  input[type=text], textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
  button { font: inherit; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--green); background: var(--green); color: #fff; cursor: pointer; margin-top: 14px; }
  .ok { color: var(--ok); font-weight: 700; } .bad { color: var(--bad); font-weight: 700; }
</style></head>
<body><main>
  <div class="card" id="top"><h1>Out of specification result</h1><p class="muted">Loading…</p></div>
  <div class="card" id="form" hidden></div>
</main>
<script src="/js/public/oos-response.js"></script>
</body></html>
